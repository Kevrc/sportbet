# CONGELADO: solo cambia en un PR pequeño y aparte, avisando al grupo.
# Montos en centavos enteros (*Cents) y cuotas en centésimas (oddX100: 214 = 2.14).
openapi: 3.1.0
info:
  title: SportBet API
  version: 0.1.0
  description: Casa de apuestas deportivas con dinero virtual.
servers:
  - url: /api/v1
tags:
  - { name: auth, description: Persona 1 }
  - { name: users, description: Persona 1 }
  - { name: admin, description: Persona 1 }
  - { name: events, description: Persona 2 }
  - { name: markets, description: Persona 2 }
  - { name: providers, description: Persona 2 }
  - { name: betting, description: Persona 3 }
  - { name: wallet, description: Persona 3 }
  - { name: settlement, description: Persona 3 }

security:
  - bearerAuth: []

paths:
  # ---------------- auth (Persona 1) ----------------
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      security: []
      summary: Registra un usuario y crea su billetera con el saldo inicial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Usuario creado. Envía la cookie httpOnly del refresh token.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      summary: Inicia sesión
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      security: [{ refreshCookie: [] }]
      summary: Emite un nuevo token de acceso y rota el refresh token
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      security: [{ refreshCookie: [] }]
      summary: Revoca el refresh token
      responses:
        '204': { description: Sesión cerrada }

  # ---------------- users (Persona 1) ----------------
  /me:
    get:
      operationId: getMe
      summary: Usuario autenticado
      tags: [users]
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }

  # ---------------- admin (Persona 1) ----------------
  /admin/users:
    get:
      operationId: listUsers
      summary: Lista usuarios
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedMeta'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        '403': { $ref: '#/components/responses/Error' }
  /admin/users/{id}:
    patch:
      operationId: updateUser
      summary: Cambia rol o estado de un usuario
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
                status: { type: string, enum: [active, blocked] }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/stats:
    get:
      operationId: getAdminStats
      summary: Estadísticas del panel
      tags: [admin]
      responses:
        '200':
          description: Estadísticas del panel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStats' }
  /admin/audit:
    get:
      operationId: listAudit
      summary: Registro de auditoría
      tags: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Registro de auditoría
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedMeta'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }

  # ---------------- events (Persona 2) ----------------
  /leagues:
    get:
      operationId: listLeagues
      summary: Lista ligas
      tags: [events]
      security: []
      responses:
        '200':
          description: Ligas
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/League' } }
  /events:
    get:
      operationId: listEvents
      summary: Lista eventos
      tags: [events]
      security: []
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: leagueId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MatchStatus' } }
        - { name: featured, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Event' } }
  /events/live:
    get:
      operationId: listLiveEvents
      tags: [events]
      security: []
      summary: Estado actual de los partidos en juego (al conectar o reconectar el SSE)
      responses:
        '200':
          description: Eventos en vivo
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Event' } }
  /events/stream:
    get:
      operationId: streamEvents
      tags: [events]
      security: []
      summary: Stream SSE público con cambios de partidos
      description: |
        Tipos de mensaje (campo `event:`): `match.updated`, `match.started`, `match.finished`.
        El `data:` es el JSON del evento del bus (MatchUpdated, MatchStarted, MatchFinished).
        Cada mensaje lleva `id:` y cada 15 s se envía un comentario `: ping`.
      responses:
        '200':
          description: Stream de eventos
          content:
            text/event-stream:
              schema: { type: string }
  /events/{id}:
    get:
      operationId: getEvent
      summary: Detalle de un evento con sus mercados
      tags: [events]
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Evento con sus mercados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/events/{id}:
    patch:
      operationId: updateEvent
      summary: Marca o desmarca un evento como destacado
      tags: [events]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [featured]
              properties:
                featured: { type: boolean }
      responses:
        '200':
          description: Evento actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }

  # ---------------- markets (Persona 2) ----------------
  /events/{id}/markets:
    get:
      operationId: listEventMarkets
      summary: Mercados de un evento
      tags: [markets]
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Mercados del evento
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Market' } }

  # ---------------- providers (Persona 2) ----------------
  /admin/providers/status:
    get:
      operationId: getProviderStatus
      summary: Estado del proveedor y presupuesto del día
      tags: [providers]
      responses:
        '200':
          description: Estado del proveedor y presupuesto del día
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderStatus' }
  /admin/replay/start:
    post:
      operationId: startReplay
      summary: Inicia el ReplayProvider
      tags: [providers]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file: { type: string }
                speed: { type: integer, minimum: 1 }
      responses:
        '202': { description: Replay iniciado }

  # ---------------- betting (Persona 3) ----------------
  /bets:
    post:
      operationId: placeBet
      tags: [betting]
      summary: Realiza una apuesta simple (1 selección) o combinada (2 a 5)
      description: |
        Reintentar con la misma `Idempotency-Key` devuelve 200 con la apuesta original
        (409 si el cuerpo es distinto). Si alguna `oddX100` no coincide con la cuota actual
        responde 409 `ODDS_CHANGED`. Mercado cerrado o saldo insuficiente: 422.
        Dos selecciones del mismo partido: 422 `CORRELATED_SELECTIONS`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceBetRequest' }
      responses:
        '201':
          description: Apuesta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bet' }
        '200':
          description: Reintento idempotente; devuelve la apuesta original
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bet' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    get:
      operationId: listBets
      summary: Historial de apuestas
      tags: [betting]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BetStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Historial de apuestas del usuario
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedMeta'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Bet' } }
  /bets/{id}:
    get:
      operationId: getBet
      summary: Detalle de una apuesta
      tags: [betting]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Apuesta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bet' }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------- wallet (Persona 3) ----------------
  /wallet:
    get:
      operationId: getWallet
      summary: Saldo del usuario
      tags: [wallet]
      responses:
        '200':
          description: Saldo del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
  /wallet/transactions:
    get:
      operationId: listWalletTransactions
      summary: Movimientos de la billetera
      tags: [wallet]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Movimientos del usuario
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedMeta'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/WalletTransaction' } }

  # ---------------- settlement (Persona 3) ----------------
  /admin/settlement/run:
    post:
      operationId: runSettlement
      tags: [settlement]
      summary: Fuerza el barrido de liquidación
      responses:
        '202':
          description: Barrido ejecutado
          content:
            application/json:
              schema:
                type: object
                required: [processed]
                properties:
                  processed: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: sb_refresh

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [INSUFFICIENT_FUNDS, ODDS_CHANGED, MARKET_CLOSED, VALIDATION_ERROR] }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }

    PagedMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    Role:
      type: string
      enum: [user, admin]
    MatchStatus:
      type: string
      enum: [SCHEDULED, LIVE, INTERRUPTED, FINISHED, POSTPONED, CANCELLED, ABANDONED, AWARDED]
    MarketStatus:
      type: string
      enum: [OPEN, CLOSED, SETTLED, VOID]
    SelectionResult:
      type: string
      enum: [PENDING, WON, LOST, VOID]
    BetStatus:
      type: string
      enum: [PENDING, WON, LOST, VOID]

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string, minLength: 2, maxLength: 40 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    UserSummary:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [status, createdAt]
          properties:
            status: { type: string, enum: [active, blocked] }
            createdAt: { type: string, format: date-time }
    AdminStats:
      type: object
      required: [users, betsPlaced, betsSettled, stakeCents, payoutCents]
      properties:
        users: { type: integer }
        betsPlaced: { type: integer }
        betsSettled: { type: integer }
        stakeCents: { type: integer, format: int64 }
        payoutCents: { type: integer, format: int64 }
    AuditEntry:
      type: object
      required: [id, action, entity, createdAt]
      properties:
        id: { type: integer }
        actorId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        entity: { type: string }
        entityId: { type: [string, 'null'] }
        data: { type: object }
        createdAt: { type: string, format: date-time }

    League:
      type: object
      required: [id, name, country, featured]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        featured: { type: boolean }
        logoUrl: { type: [string, 'null'], format: uri, description: Logo de la liga (https) }
        flagUrl: { type: [string, 'null'], format: uri, description: Bandera del país (https) }
    Team:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        logoUrl:
          type: [string, 'null']
          format: uri
          description: Escudo del equipo (https). null si el proveedor no lo entrega, por ejemplo en el replay.
    Event:
      type: object
      required: [id, league, home, away, startAt, status, featured]
      properties:
        id: { type: string, format: uuid }
        league: { $ref: '#/components/schemas/League' }
        home: { $ref: '#/components/schemas/Team' }
        away: { $ref: '#/components/schemas/Team' }
        startAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/MatchStatus' }
        homeScore: { type: [integer, 'null'] }
        awayScore: { type: [integer, 'null'] }
        minute: { type: [integer, 'null'] }
        featured: { type: boolean }
        liveUpdatedAt:
          type: [string, 'null']
          format: date-time
          description: El frontend marca el dato como desactualizado si tiene más de 5 minutos.
        round:
          type: [string, 'null']
          description: Jornada tal como la nombra el proveedor, p. ej. "Regular Season - 8".
        venue:
          type: [object, 'null']
          required: [name]
          properties:
            name: { type: string }
            city: { type: [string, 'null'] }
    EventDetail:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          required: [markets]
          properties:
            markets: { type: array, items: { $ref: '#/components/schemas/Market' } }
    Market:
      type: object
      required: [id, eventId, code, status, selections]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        code: { type: string, enum: [MATCH_RESULT, TOTAL_GOALS_2_5, BOTH_TEAMS_TO_SCORE] }
        status: { $ref: '#/components/schemas/MarketStatus' }
        selections: { type: array, items: { $ref: '#/components/schemas/Selection' } }
    Selection:
      type: object
      required: [id, code, label, oddX100, result]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, enum: [HOME, DRAW, AWAY, OVER, UNDER, YES, NO] }
        label: { type: string }
        oddX100: { type: integer, minimum: 101, examples: [214] }
        result: { $ref: '#/components/schemas/SelectionResult' }

    ProviderStatus:
      type: object
      required: [provider, day, requestsUsed, budget]
      properties:
        provider: { type: string, enum: [replay, apifootball] }
        day: { type: string, format: date }
        requestsUsed: { type: integer }
        budget: { type: integer }
        lastSyncAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }

    PlaceBetRequest:
      type: object
      required: [stakeCents, selections]
      properties:
        stakeCents: { type: integer, format: int64, minimum: 100, maximum: 50000 }
        selections:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required: [selectionId, oddX100]
            properties:
              selectionId: { type: string, format: uuid }
              oddX100:
                type: integer
                description: Cuota que vio el usuario; si cambió, la apuesta se rechaza con ODDS_CHANGED.
    Bet:
      type: object
      required: [id, stakeCents, totalOddX100, potentialPayoutCents, status, payoutCents, placedAt, selections]
      properties:
        id: { type: string, format: uuid }
        stakeCents: { type: integer, format: int64 }
        totalOddX100: { type: integer }
        potentialPayoutCents: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/BetStatus' }
        payoutCents: { type: integer, format: int64 }
        placedAt: { type: string, format: date-time }
        settledAt: { type: [string, 'null'], format: date-time }
        selections: { type: array, items: { $ref: '#/components/schemas/BetSelection' } }
    BetSelection:
      type: object
      required: [selectionId, eventId, eventName, marketCode, selectionCode, label, oddX100, result]
      properties:
        selectionId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventName: { type: string, examples: ['Atlético Demo vs Deportivo Prueba'] }
        marketCode: { type: string }
        selectionCode: { type: string }
        label: { type: string }
        oddX100: { type: integer }
        result: { $ref: '#/components/schemas/SelectionResult' }

    Wallet:
      type: object
      required: [balanceCents, currency]
      properties:
        balanceCents: { type: integer, format: int64 }
        currency: { type: string, const: VIRT }
    WalletTransaction:
      type: object
      required: [id, type, amountCents, balanceAfterCents, reference, createdAt]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [DEPOSIT_INITIAL, BET_STAKE, BET_PAYOUT, BET_REFUND, BET_PAYOUT_REVERSAL, BET_REFUND_REVERSAL, ADMIN_ADJUSTMENT]
        amountCents: { type: integer, format: int64, description: 'Positivo acredita, negativo debita' }
        balanceAfterCents: { type: integer, format: int64 }
        reference: { type: string }
        createdAt: { type: string, format: date-time }
