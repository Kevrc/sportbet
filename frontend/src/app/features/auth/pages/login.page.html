<section class="card" aria-labelledby="login-title">
  <h1 id="login-title">Iniciar sesión</h1>
  <p class="subtitle">Entra para apostar con tu saldo virtual.</p>

  @if (error(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="invalid('email')"
        aria-describedby="login-email-error"
      />
      @if (invalid('email')) {
        <span id="login-email-error" class="field-error">Escribe un email válido.</span>
      }
    </div>

    <div class="field">
      <label for="login-password">Contraseña</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="invalid('password')"
        aria-describedby="login-password-error"
      />
      @if (invalid('password')) {
        <span id="login-password-error" class="field-error">Escribe tu contraseña.</span>
      }
    </div>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p class="switch">
    ¿No tienes cuenta?
    <a routerLink="/auth/register" [queryParams]="returnUrl() ? { returnUrl: returnUrl() } : {}"
      >Crear cuenta</a
    >
  </p>
</section>
